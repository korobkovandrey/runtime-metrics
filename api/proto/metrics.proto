syntax = "proto3";

package runtime_metrics;

option go_package = "github.com/korobkovandrey/runtime-metrics/pkg/proto";

enum MetricType {
    UNKNOWN = 0;
    GAUGE = 1;
    COUNTER = 2;
}

message Metric {
    string id = 1;
    MetricType type = 2;
    double value = 3;
    int64 delta = 4;
}

message Metrics {
    repeated Metric metrics = 1;
}

message Response {}

service MetricsService {
    rpc Update(Metric) returns (Response);
    rpc Updates(Metrics) returns (Response);
}
